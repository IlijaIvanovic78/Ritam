services:
  ritam:
    build: .
    image: ritam:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SIGNUP: ${SIGNUP:-open}
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      TRUST_PROXY: "1"
      TZ: Europe/Belgrade

    volumes:
      - ritam-data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  ritam-data:
