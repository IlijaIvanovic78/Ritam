# Nginx ispred Ritam-a (Docker sluša samo na 127.0.0.1:3001).
#   sudo cp deploy/nginx/ritamorg.com.conf /etc/nginx/sites-available/ritamorg.com
#   sudo ln -s /etc/nginx/sites-available/ritamorg.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d ritamorg.com -d www.ritamorg.com
#   (certbot sam dopiše HTTPS deo, preusmeri HTTP na HTTPS i obnavlja sertifikat)

server {
    listen 80;
    listen [::]:80;
    server_name ritamorg.com www.ritamorg.com;

    # Vraćanje rezervne kopije (JSON) može biti do 20 MB; Nginx podrazumevano dozvoljava samo 1 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Aplikacija (TRUST_PROXY=1) čita adresu klijenta iz poslednjeg X-Forwarded-For unosa
        # i HTTPS iz X-Forwarded-Proto (Secure kolačić, HSTS).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
